syntax = "proto3";

package chat;

service ChatInternal {
  rpc GetChatMembers (ChatIdRequest) returns (MembersResponse);
  rpc IsMember (MembershipRequest) returns (MembershipResponse);
  rpc SendMessageInternal (SendMessageInternalRequest) returns (SendMessageInternalResponse);
  rpc GetUnreadMessages (UnreadMessagesRequest) returns (UnreadMessagesResponse);
  rpc GetUserMessagesInChat (UserMessagesInChatRequest) returns (UserMessagesInChatResponse);
  rpc GetRecentMessages (RecentMessagesRequest) returns (RecentMessagesResponse);
  rpc GetDirectChats (UserIdRequest) returns (DirectChatsResponse);
}

message SendMessageInternalRequest{
  string chatId = 1;
  string senderId = 2;
  string content = 3;
  bool viaAssistant = 4;
}

message SendMessageInternalResponse {
  bool success = 1;
  string messageId = 2;
  string error = 3;
}

message ChatIdRequest {
  string chatId = 1;
}

message MembersResponse {
  repeated string memberIds = 1;
}

message MembershipRequest {
  string chatId = 1;
  string userId = 2;
}

message MembershipResponse {
  bool isMember = 1;
}

message UnreadMessagesRequest {
  string userId = 1;
  int32 maxMessagesPerChat = 2;
}

message UnreadMessage {
  string messageId = 1;
  string senderId = 2;
  string content = 3;
  string type = 4;
  string createdAt = 5;
}

message UnreadChat {
  string chatId = 1;
  string chatType = 2;
  string title = 3;
  string otherMemberId = 4;
  repeated UnreadMessage messages = 5;
}

message UnreadMessagesResponse {
  repeated UnreadChat chats = 1;
}

message UserMessagesInChatRequest {
  string chatId = 1;
  string userId = 2;
  int32 limit = 3;
}

message UserMessagesInChatResponse {
  repeated string messages = 1;
}

message RecentMessagesRequest {
  string chatId = 1;
  int32 limit = 2;
}

message RecentMessage {
  string senderId = 1;
  string content = 2;
  bool viaAssistant = 3;
  string createdAt = 4;
}

message RecentMessagesResponse {
  repeated RecentMessage messages = 1;
}

message UserIdRequest {
  string userId = 1;
}

message DirectChat {
  string chatId = 1;
  string otherMemberId = 2;
}

message DirectChatsResponse {
  repeated DirectChat chats = 1;
}